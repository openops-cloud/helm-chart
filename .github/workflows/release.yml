name: Release Helm Chart

run-name: Release Helm chart ${{ inputs.version }}${{ inputs.draft && '-draft' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: Release version (e.g., 0.6.15). Used for chart version, appVersion, and image tags.
        required: true
      draft:
        type: boolean
        description: Create a draft release (chart version gets -draft suffix)
        default: true

jobs:
  release:
    name: Package and publish Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    # The release identity's federated credentials are scoped to this environment rather than to
    # a branch, so a release runs from any branch - and the environment is where an approval gate
    # for publishing to the public registry belongs. Without it the OIDC subject does not match.
    environment: release
    env:
      CHART_VERSION: ${{ inputs.draft && format('{0}-draft', inputs.version) || inputs.version }}
      APP_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Set chart version and appVersion
        run: |
          set -euo pipefail
          sed -i "s/^version:.*/version: $CHART_VERSION/" chart/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"$APP_VERSION\"/" chart/Chart.yaml
          sed -i 's/^  version: .*/  version: "'"$APP_VERSION"'"/' chart/values.yaml
          echo "### Chart.yaml" >> $GITHUB_STEP_SUMMARY
          echo '```yaml' >> $GITHUB_STEP_SUMMARY
          cat chart/Chart.yaml >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Lint chart
        run: helm lint chart

      - name: Package chart
        run: |
          set -euo pipefail
          pkg_output=$(helm package chart --version "$CHART_VERSION" --app-version "$APP_VERSION")
          echo "$pkg_output"
          chart_package=$(printf '%s\n' "$pkg_output" | awk '/Successfully packaged chart and saved it to:/ {print $NF}')
          echo "CHART_PACKAGE=$chart_package" >> "$GITHUB_ENV"

      - name: Azure login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_ACR_RELEASE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push chart to the public ACR
        env:
          ACR_PUBLIC_NAME: ${{ vars.ACR_PUBLIC_NAME }}
          ACR_PUBLIC_LOGIN_SERVER: ${{ vars.ACR_PUBLIC_LOGIN_SERVER }}
        run: |
          set -euo pipefail
          # --expose-token rather than plain `az acr login`: that writes Docker's credential
          # store, which helm does not read. helm wants its own registry login.
          TOKEN=$(az acr login --name "$ACR_PUBLIC_NAME" --expose-token --output tsv --query accessToken)
          helm registry login "$ACR_PUBLIC_LOGIN_SERVER" \
            --username 00000000-0000-0000-0000-000000000000 --password-stdin <<<"$TOKEN"
          helm push "$CHART_PACKAGE" "oci://$ACR_PUBLIC_LOGIN_SERVER/helm"
          echo "- ✅ Pushed \`oci://$ACR_PUBLIC_LOGIN_SERVER/helm/openops:${CHART_VERSION}\`" >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ github.sha }}
          tag_name: ${{ env.CHART_VERSION }}
          name: openops-${{ env.CHART_VERSION }}
          generate_release_notes: true
          draft: ${{ inputs.draft }}
          files: ${{ env.CHART_PACKAGE }}

      - name: Write summary
        run: |
          echo "### Helm Chart Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Chart version | \`$CHART_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| App version | \`$APP_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Draft | \`${{ inputs.draft }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install with:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "helm install openops oci://${{ vars.ACR_PUBLIC_LOGIN_SERVER }}/helm/openops --version $CHART_VERSION" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

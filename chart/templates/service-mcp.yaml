{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mcp.name }}
  labels:
    {{- include "openops.componentLabels" (dict "root" . "component" "mcp") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.mcp.port }}
    targetPort: {{ .Values.mcp.port }}
    protocol: TCP
    name: http
  selector:
    {{- include "openops.componentSelectorLabels" (dict "root" . "component" "mcp") | nindent 4 }}
{{- end }}

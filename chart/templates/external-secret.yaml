{{- if .Values.externalSecrets.enabled }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  {{- $provider := (.Values.externalSecrets).provider | default "aws" }}
  {{- if eq $provider "azure-keyvault" }}
  name: azure-keyvault
  {{- else if eq $provider "aws" }}
  name: aws-secretsmanager
  {{- else }}
  {{- fail (printf "Unsupported externalSecrets.provider: %s. Supported values: aws, azure-keyvault" $provider) }}
  {{- end }}
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    {{- if eq $provider "azure-keyvault" }}
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ required "externalSecrets.azureKeyVault.vaultUrl is required when provider is azure-keyvault" .Values.externalSecrets.azureKeyVault.vaultUrl }}
      tenantId: {{ required "externalSecrets.azureKeyVault.tenantId is required when provider is azure-keyvault" .Values.externalSecrets.azureKeyVault.tenantId }}
      serviceAccountRef:
        name: {{ .Values.externalSecrets.serviceAccount.name | default "external-secrets-sa" }}
    {{- else }}
    aws:
      service: SecretsManager
      region: {{ .Values.global.awsRegion | default "eu-central-1" }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.externalSecrets.serviceAccount.name | default "external-secrets-sa" }}
    {{- end }}
---
{{- if .Values.externalSecrets.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.externalSecrets.serviceAccount.name | default "external-secrets-sa" }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.externalSecrets.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.externalSecrets.serviceAccount.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretEnv.existingSecret | default "openops-env" }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    {{- if eq $provider "azure-keyvault" }}
    name: azure-keyvault
    {{- else }}
    name: aws-secretsmanager
    {{- end }}
    kind: SecretStore
  target:
    name: {{ .Values.secretEnv.existingSecret | default "openops-env" }}
    creationPolicy: Owner
  data:
{{- $allEnv := dict -}}
{{- range $k, $v := .Values.openopsEnvSecrets }}{{ $_ := set $allEnv $k ($v | toString) }}{{ end }}
{{- range $k, $v := .Values.openopsEnv }}{{ if not (hasKey $allEnv $k) }}{{ $_ := set $allEnv $k ($v | toString) }}{{ end }}{{ end }}
{{- range $k, $v := .Values.tables.env }}{{ if not (hasKey $allEnv $k) }}{{ $_ := set $allEnv $k ($v | toString) }}{{ end }}{{ end }}
{{- range $k, $v := .Values.analytics.env }}{{ if not (hasKey $allEnv $k) }}{{ $_ := set $allEnv $k ($v | toString) }}{{ end }}{{ end }}
{{- range $k, $v := .Values.postgres.env }}{{ if not (hasKey $allEnv $k) }}{{ $_ := set $allEnv $k ($v | toString) }}{{ end }}{{ end }}
{{- if .Values.worker }}{{- if .Values.worker.env }}
{{- range $k, $v := .Values.worker.env }}{{ if not (hasKey $allEnv $k) }}{{ $_ := set $allEnv $k ($v | toString) }}{{ end }}{{ end }}
{{- end }}{{- end }}
{{- /* Gated on mcp.enabled: External Secrets fails the whole sync on a missing property */ -}}
{{- if .Values.mcp.enabled }}
{{- range $k, $v := .Values.mcp.env }}{{ if not (hasKey $allEnv $k) }}{{ $_ := set $allEnv $k ($v | toString) }}{{ end }}{{ end }}
{{- end }}
{{- include "openops.collectSecretEntries" (dict "root" $ "env" $allEnv "secretName" .Values.externalSecrets.secretName) }}
{{- end }}
